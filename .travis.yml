language: node_js
node_js:
  - "18"
dist: jammy
sudo: false

branches:
  only:
  - master

cache:
  directories:
    - node_modules

install:
  - npm ci

script:
  - npm run build -- --base-href https://claudiuconstantin.github.io/cron-editor/
deploy:
  provider: pages
  skip_cleanup: true
  github_token: $GH_TOKEN
  local_dir: dist/cron-editor-app
  on:
    branch: master